<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Hubungi Saya</title>

    <style>
      body {
        margin: 0;
        background-color: #eee9f7;
        font-family: Arial, sans-serif;
        color: #39304d;
      }

      #contact {
        padding: 40px 20px;
      }

      .contact-form {
        width: 400px;
        max-width: 100%;
        margin: auto;
        padding: 24px;
        border: 1px solid #a58ac7;
        background-color: #ffffff;
        border-radius: 12px;
        box-sizing: border-box;
      }

      .contact-form h2 {
        text-align: center;
        color: #594078;
      }

      .form-group {
        margin-bottom: 16px;
      }

      .form-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 6px;
        color: #514465;
      }

      .form-group input,
      .form-group textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        border: 1px solid #c9bddb;
        border-radius: 6px;
        font-family: Arial, sans-serif;
        background-color: #faf8fd;
      }

      .form-group input:focus,
      .form-group textarea:focus {
        outline: none;
        border-color: #8056ad;
        background-color: #f3edfa;
      }

      .btn-submit {
        background-color: #76519c;
        color: white;
        padding: 10px 18px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }

      .btn-submit:hover {
        background-color: #493362;
      }

      footer {
        text-align: center;
        padding: 20px;
      }

      footer a {
        color: #76519c;
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <section id="contact">
      <form class="contact-form">
        <h2>Hubungi Saya</h2>

        <div class="form-group">
          <label for="nama">Nama</label>
          <input
            type="text"
            id="nama"
            name="nama"
            placeholder="Masukkan nama"
          />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Masukkan email"
          />
        </div>

        <div class="form-group">
          <label for="pesan">Pesan</label>
          <textarea
            id="pesan"
            name="pesan"
            rows="5"
            placeholder="Tulis pesanmu"
          ></textarea>
        </div>

        <button type="submit" class="btn-submit">Kirim Pesan</button>
      </form>
    </section>

    <footer>
      <a href="../index.html">Kembali ke Beranda</a>
    </footer>
  </body>
</html>
